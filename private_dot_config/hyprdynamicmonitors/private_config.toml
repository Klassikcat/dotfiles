[general]
destination = "$HOME/.config/hypr/monitors.conf"
# Hyprland autoreload fires while outputs are still settling (wallpaper/waybar land misplaced); a second reload fixes it.

[power_events]

[power_events.dbus_query_object]
path = "/org/freedesktop/UPower/devices/line_power_AC0"

[[power_events.dbus_signal_match_rules]]
object_path = "/org/freedesktop/UPower/devices/line_power_AC0"


[profiles.alone-display]
config_file = "/home/shinjungtae/.config/hyprdynamicmonitors/hyprconfigs/alone-display.go.tmpl"
config_file_type = "template"
[profiles.alone-display.conditions]

[[profiles.alone-display.conditions.required_monitors]]
description = "Samsung Display Corp. ATNA33AA08-0"
monitor_tag = "monitor0"


[profiles.Two-monitors]
config_file = "/home/shinjungtae/.config/hyprdynamicmonitors/hyprconfigs/Two-monitors.go.tmpl"
