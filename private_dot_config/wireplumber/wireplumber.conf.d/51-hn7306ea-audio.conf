# ASUS ProArt PX13 HN7306EA workaround
# The TAS2783 SmartAmp capture PCM (hw:1,3 / pro-input-3) currently fails
# SoundWire transport setup with -EINVAL and can put PipeWire streams in error.
# Disable only that broken capture node; keep SmartAmp playback (pro-output-2).
monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_input.pci-0000_c4_00.5-platform-amd_sdw.pro-input-3.*"
      }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
  {
    matches = [
      {
        node.name = "~alsa_output.pci-0000_c4_00.5-platform-amd_sdw.pro-output-0.*"
      }
    ]
    actions = {
      update-props = {
        priority.driver = 1000
        priority.session = 1000
      }
    }
  }
  {
    matches = [
      {
        node.name = "~alsa_output.pci-0000_c4_00.5-platform-amd_sdw.pro-output-2.*"
      }
    ]
    actions = {
      update-props = {
        api.alsa.period-size = 1024
        api.alsa.headroom = 2048
        priority.driver = 2000
        priority.session = 2000
      }
    }
  }
  {
    matches = [
      {
        node.name = "~alsa_output.pci-0000_c4_00.5-platform-amd_sdw.HiFi__Speaker__sink"
      }
    ]
    actions = {
      update-props = {
        # HiFi 프로파일용: AMD ACP SoundWire DMA 타이밍 여유 (pro-output-2 룰은 HiFi 노드명에 안 걸림)
        api.alsa.headroom = 1024
      }
    }
  }
]
